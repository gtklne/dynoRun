    <!--
      DIRECTION CONTRACT (impeccable, seed fc19f008)

      THESIS: Every screen is an instrument approach plate, one sheet read correctly
      under stress. It refuses the dark dashboard of rounded stat cards.
      OWN-WORLD: White chart sheet, near-black ink, blue-grey terrain, magenta only on
      the line you actually flew, amber only for advisories. Hairline rules and boxed
      frames, never cards or shadows. One family, Archivo variable: hierarchy comes from
      width, weight, case and rule. Hatching marks missing data; nothing is blank. The
      night plate inverts the sheet.
      STORY: A rider sees a measurement they can defend, understands what it is worth,
      and decides whether the change stays.
      FIRST VIEWPORT: Title block across the top; plan view left; marginal legend right;
      profile view beneath, sharing the plan axis; boxed minima table beside it; revision
      bar at the foot. The primary action is a solid ink plate in the legend column.
      FORM: Approach Plate, position 1 of 7 on the ordered list, taken as the pick card
      against assigned index 7; seed key fc19f008.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
