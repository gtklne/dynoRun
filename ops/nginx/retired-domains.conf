# Keep retired domains reachable so crawlers can observe permanent removal.
# Do not block robots.txt: every path, including robots.txt, must be crawlable
# and return a real 410 response.
#
# Hand-applied on dynorun-prod as /etc/nginx/sites-available/retired-domains,
# symlinked into sites-enabled. CI only rsyncs dist/, so a push never deploys
# this file: copy it up and reload nginx by hand.
#
# A 410 rather than letting these names fail or redirect. wasgoht.ch/ was stuck
# in a duplicate cluster whose elected canonical was a whatsgoodin.ch URL, and
# Google will not drop a canonical it cannot fetch: unreachable reads as
# temporarily-failing, forever. A fetchable permanent-removal signal is what
# lets the cluster dissolve, so every retired name must answer, not time out.
#
# certbot's nginx authenticator renews these despite the server-level
# `return 410` (verified by --dry-run). Keep using --nginx: a webroot would need
# the 410 moved into `location /`, and the server-level return is what
# guarantees no path can escape it.
server {
    listen 80;
    listen [::]:80;
    server_name
        whatsgoodin.ch www.whatsgoodin.ch
        weekendwolf.app www.weekendwolf.app
        weekendwombat.com www.weekendwombat.com
        partydna.ch www.partydna.ch;

    default_type text/plain;
    add_header X-Robots-Tag "noindex" always;
    return 410 "Gone\n";
}

# weekendwolf.app has no 443 block on purpose: its DNS points at Cloudflare,
# not at this server, and Cloudflare already answers 410 on both schemes. It
# stays in the port 80 block above only so this file documents the full set of
# retired names; requests never actually arrive here.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name whatsgoodin.ch www.whatsgoodin.ch;

    ssl_certificate /etc/letsencrypt/live/whatsgoodin.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatsgoodin.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    default_type text/plain;
    add_header X-Robots-Tag "noindex" always;
    return 410 "Gone\n";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name partydna.ch www.partydna.ch;

    ssl_certificate /etc/letsencrypt/live/partydna.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partydna.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    default_type text/plain;
    add_header X-Robots-Tag "noindex" always;
    return 410 "Gone\n";
}

# Without this block https://weekendwombat.com/ fell through to the default 443
# server: it presented the wasgoht.ch certificate, so a crawler gave up at the
# handshake (the unreachable state described above), and anything ignoring the
# mismatch got a 301 to https://wasgoht.ch/hello, handing the retired domain's
# history to the very page the /hello move exists to keep clean.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name weekendwombat.com www.weekendwombat.com;

    ssl_certificate /etc/letsencrypt/live/weekendwombat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weekendwombat.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    default_type text/plain;
    add_header X-Robots-Tag "noindex" always;
    return 410 "Gone\n";
}
